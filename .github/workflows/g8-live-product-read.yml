name: g8-live-product-read-acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main SHA to verify
        required: true
        type: string
      confirmation:
        description: Type RUN_G8_LIVE_READ
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g8-live-product-read-${{ github.sha }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VOODOO_ENV: staging
      VOODOO_DATABASE_BACKEND: sqlite
      VOODOO_ALLOW_PRODUCTION_EFFECTS: "false"
      VOODOO_G8_READ_RUNTIME: enabled
      VOODOO_TRUSTED_HOSTS: localhost,127.0.0.1
      VONE_G8_BASE_URL: http://127.0.0.1:18080
      VONE_G8_TARGET_REPOSITORY: ${{ github.repository }}
      VONE_G8_TARGET_REF: refs/heads/main
      VONE_G8_EXPECTED_TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify exact main candidate and confirmation
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "RUN_G8_LIVE_READ"
          test "${#EXPECTED_SHA}" -eq 40
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up locked Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        shell: bash
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify exact candidate before live provider access
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q voodoo_product scripts tests
          node --check voodoo_product/static/app.js
          node --check voodoo_product/static/control_room.js
          python -m pytest -q
          python scripts/product_readiness_gate.py
          mkdir -p "$RUNNER_TEMP/g8-evidence"
          python -m pip_audit \
            --disable-pip \
            --strict \
            -r requirements-product.lock \
            --require-hashes \
            -f cyclonedx-json \
            -o "$RUNNER_TEMP/g8-evidence/sbom.cdx.json"

      - name: Build exact-head product image and derive bounded profiles
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="vone-g8-live:${GITHUB_SHA}"
          docker build --file Dockerfile.product --tag "$IMAGE" .
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          ROOTFS_DIGEST="${IMAGE_ID#sha256:}"
          test "${#ROOTFS_DIGEST}" -eq 64
          API_IP="$(getent ahostsv4 api.github.com | awk '{print $1}' | sort -u | head -n1)"
          test -n "$API_IP"
          RESOURCE_PROFILE='cpu=1;memory=512m;pids=256;capabilities=DROP_ALL;no_new_privileges=true'
          NETWORK_PROFILE="default=DENY_ALL;allow=tcp:api.github.com:${API_IP}:443"
          RESOURCE_DIGEST="$(printf '%s' "$RESOURCE_PROFILE" | sha256sum | awk '{print $1}')"
          NETWORK_DIGEST="$(printf '%s' "$NETWORK_PROFILE" | sha256sum | awk '{print $1}')"
          LOCK_DIGEST="$(sha256sum requirements-product.lock | awk '{print $1}')"
          SBOM_DIGEST="$(sha256sum "$RUNNER_TEMP/g8-evidence/sbom.cdx.json" | awk '{print $1}')"
          {
            echo "VONE_G8_IMAGE=$IMAGE"
            echo "VONE_G8_ROOTFS_DIGEST=$ROOTFS_DIGEST"
            echo "VONE_G8_API_IP=$API_IP"
            echo "VONE_G8_RESOURCE_DIGEST=$RESOURCE_DIGEST"
            echo "VONE_G8_NETWORK_DIGEST=$NETWORK_DIGEST"
            echo "VOODOO_G8_DEPENDENCY_LOCK_DIGEST=$LOCK_DIGEST"
            echo "VOODOO_G8_SBOM_DIGEST=$SBOM_DIGEST"
            echo "VOODOO_G8_REVOCATION_EPOCH=0"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/g8-evidence/build.json" <<EOF
          {"source_sha":"$GITHUB_SHA","image_digest":"$ROOTFS_DIGEST","dependency_lock_digest":"$LOCK_DIGEST","sbom_digest":"$SBOM_DIGEST","resource_profile_digest":"$RESOURCE_DIGEST","network_policy_digest":"$NETWORK_DIGEST"}
          EOF

      - name: Create ephemeral product credentials
        shell: bash
        run: |
          set -euo pipefail
          SESSION_SECRET="$(openssl rand -hex 32)"
          BOOTSTRAP_TOKEN="$(openssl rand -hex 24)"
          ADMIN_PASSWORD="$(openssl rand -hex 24)"
          OPERATOR_PASSWORD="$(openssl rand -hex 24)"
          for secret in "$SESSION_SECRET" "$BOOTSTRAP_TOKEN" "$ADMIN_PASSWORD" "$OPERATOR_PASSWORD"; do
            echo "::add-mask::$secret"
          done
          {
            echo "VOODOO_SESSION_SIGNING_SECRET=$SESSION_SECRET"
            echo "VOODOO_BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN"
            echo "VONE_G8_ACCEPTANCE_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD=$OPERATOR_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Attest distinct Runner and Verifier provider principals
        shell: bash
        env:
          RUNNER_GITHUB_TOKEN: ${{ secrets.VONE_G8_RUNNER_GITHUB_TOKEN }}
          VERIFIER_GITHUB_TOKEN: ${{ secrets.VONE_G8_VERIFIER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RUNNER_GITHUB_TOKEN"
          test -n "$VERIFIER_GITHUB_TOKEN"
          runner_json="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $RUNNER_GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user)"
          verifier_json="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $VERIFIER_GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user)"
          runner_id="$(printf '%s' "$runner_json" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          verifier_id="$(printf '%s' "$verifier_json" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          runner_type="$(printf '%s' "$runner_json" | python -c 'import json,sys; print(json.load(sys.stdin)["type"])')"
          verifier_type="$(printf '%s' "$verifier_json" | python -c 'import json,sys; print(json.load(sys.stdin)["type"])')"
          test "$runner_id" != "$verifier_id"
          printf '{"runner":{"id":%s,"type":"%s"},"verifier":{"id":%s,"type":"%s"}}\n' \
            "$runner_id" "$runner_type" "$verifier_id" "$verifier_type" \
            > "$RUNNER_TEMP/g8-evidence/provider-principals.json"

      - name: Prove both credentials observe the exact main SHA
        shell: bash
        env:
          RUNNER_GITHUB_TOKEN: ${{ secrets.VONE_G8_RUNNER_GITHUB_TOKEN }}
          VERIFIER_GITHUB_TOKEN: ${{ secrets.VONE_G8_VERIFIER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          runner_sha="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $RUNNER_GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ref_url" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          verifier_sha="$(curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $VERIFIER_GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ref_url" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$runner_sha" = "$GITHUB_SHA"
          test "$verifier_sha" = "$GITHUB_SHA"
          test "$runner_sha" = "$verifier_sha"
          printf '{"target_ref":"refs/heads/main","runner_sha":"%s","verifier_sha":"%s"}\n' \
            "$runner_sha" "$verifier_sha" \
            > "$RUNNER_TEMP/g8-evidence/provider-ref.json"

      - name: Start isolated exact-head runtime container
        shell: bash
        run: |
          set -euo pipefail
          NETWORK="vone-g8-live-${GITHUB_RUN_ID}"
          CONTAINER="vone-g8-live-${GITHUB_RUN_ID}"
          docker network create "$NETWORK"
          CONTAINER_ID="$(docker create \
            --name "$CONTAINER" \
            --network "$NETWORK" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/storage/product:rw,noexec,nosuid,size=128m \
            --memory=512m \
            --cpus=1 \
            --pids-limit=256 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --add-host "api.github.com:${VONE_G8_API_IP}" \
            -p 127.0.0.1:18080:8000 \
            -v "$GITHUB_WORKSPACE/scripts/g8_live_product_acceptance.py:/app/g8_live_product_acceptance.py:ro" \
            --entrypoint /bin/sh \
            "$VONE_G8_IMAGE" \
            -c 'sleep 2400')"
          docker start "$CONTAINER"
          CONTAINER_IP="$(docker inspect "$CONTAINER" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          test -n "$CONTAINER_IP"
          RUNNER_INSTANCE="gha-runner:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${CONTAINER_ID:0:12}"
          VERIFIER_INSTANCE="gha-verifier:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${CONTAINER_ID:0:12}"
          {
            echo "VONE_G8_NETWORK=$NETWORK"
            echo "VONE_G8_CONTAINER=$CONTAINER"
            echo "VONE_G8_CONTAINER_IP=$CONTAINER_IP"
            echo "VOODOO_G8_RUNNER_PROVIDER_INSTANCE_ID=$RUNNER_INSTANCE"
            echo "VOODOO_G8_VERIFIER_PROVIDER_INSTANCE_ID=$VERIFIER_INSTANCE"
          } >> "$GITHUB_ENV"

      - name: Enforce default-deny egress with GitHub API allowlist
        shell: bash
        run: |
          set -euo pipefail
          sudo iptables -I DOCKER-USER 1 -s "$VONE_G8_CONTAINER_IP" -j DROP
          sudo iptables -I DOCKER-USER 1 \
            -s "$VONE_G8_CONTAINER_IP" \
            -d "$VONE_G8_API_IP" \
            -p tcp --dport 443 -j ACCEPT
          sudo iptables -I DOCKER-USER 1 \
            -s "$VONE_G8_CONTAINER_IP" \
            -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -C DOCKER-USER \
            -s "$VONE_G8_CONTAINER_IP" \
            -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -C DOCKER-USER \
            -s "$VONE_G8_CONTAINER_IP" \
            -d "$VONE_G8_API_IP" \
            -p tcp --dport 443 -j ACCEPT
          sudo iptables -C DOCKER-USER -s "$VONE_G8_CONTAINER_IP" -j DROP
          if docker exec "$VONE_G8_CONTAINER" python -c \
            "import urllib.request; urllib.request.urlopen('https://example.com', timeout=5)"; then
            echo "G8_NETWORK_NEGATIVE_CHECK=FAIL"
            exit 1
          fi
          echo "G8_NETWORK_NEGATIVE_CHECK=PASS"

      - name: Initialize isolated product fixture
        shell: bash
        run: |
          set -euo pipefail
          docker exec \
            -e VOODOO_ENV=staging \
            -e VOODOO_DATABASE_BACKEND=sqlite \
            -e VOODOO_PRODUCT_DB=/app/storage/product/voodoo_one.sqlite3 \
            -e VOODOO_PRODUCT_SANDBOX_ROOT=/app/storage/product/sandboxes \
            -e "VOODOO_SESSION_SIGNING_SECRET=$VOODOO_SESSION_SIGNING_SECRET" \
            -e "VOODOO_BOOTSTRAP_TOKEN=$VOODOO_BOOTSTRAP_TOKEN" \
            -e "VONE_G8_ACCEPTANCE_ADMIN_PASSWORD=$VONE_G8_ACCEPTANCE_ADMIN_PASSWORD" \
            -e "VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD=$VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD" \
            -e VOODOO_G8_READ_RUNTIME=disabled \
            "$VONE_G8_CONTAINER" \
            python /app/g8_live_product_acceptance.py fixture \
            > "$RUNNER_TEMP/g8-evidence/fixture.json"

      - name: Run authenticated HTTP READ and restart/resume acceptance
        shell: bash
        env:
          RUNNER_GITHUB_TOKEN: ${{ secrets.VONE_G8_RUNNER_GITHUB_TOKEN }}
          VERIFIER_GITHUB_TOKEN: ${{ secrets.VONE_G8_VERIFIER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          g8_exec() {
            docker exec \
              -e VOODOO_ENV=staging \
              -e VOODOO_DATABASE_BACKEND=sqlite \
              -e VOODOO_PRODUCT_DB=/app/storage/product/voodoo_one.sqlite3 \
              -e VOODOO_PRODUCT_SANDBOX_ROOT=/app/storage/product/sandboxes \
              -e "VOODOO_SESSION_SIGNING_SECRET=$VOODOO_SESSION_SIGNING_SECRET" \
              -e "VOODOO_BOOTSTRAP_TOKEN=$VOODOO_BOOTSTRAP_TOKEN" \
              -e VOODOO_ALLOW_PRODUCTION_EFFECTS=false \
              -e VOODOO_G8_READ_RUNTIME=enabled \
              -e "VOODOO_G8_RUNNER_GITHUB_TOKEN=$RUNNER_GITHUB_TOKEN" \
              -e "VOODOO_G8_VERIFIER_GITHUB_TOKEN=$VERIFIER_GITHUB_TOKEN" \
              -e "VOODOO_G8_RUNNER_PROVIDER_INSTANCE_ID=$VOODOO_G8_RUNNER_PROVIDER_INSTANCE_ID" \
              -e "VOODOO_G8_VERIFIER_PROVIDER_INSTANCE_ID=$VOODOO_G8_VERIFIER_PROVIDER_INSTANCE_ID" \
              -e "VOODOO_G8_RUNNER_ROOTFS_DIGEST=$VONE_G8_ROOTFS_DIGEST" \
              -e "VOODOO_G8_RUNNER_RESOURCE_LIMIT_PROFILE_DIGEST=$VONE_G8_RESOURCE_DIGEST" \
              -e "VOODOO_G8_RUNNER_NETWORK_POLICY_DIGEST=$VONE_G8_NETWORK_DIGEST" \
              -e "VOODOO_G8_VERIFIER_ROOTFS_DIGEST=$VONE_G8_ROOTFS_DIGEST" \
              -e "VOODOO_G8_VERIFIER_RESOURCE_LIMIT_PROFILE_DIGEST=$VONE_G8_RESOURCE_DIGEST" \
              -e "VOODOO_G8_VERIFIER_NETWORK_POLICY_DIGEST=$VONE_G8_NETWORK_DIGEST" \
              -e "VOODOO_G8_DEPENDENCY_LOCK_DIGEST=$VOODOO_G8_DEPENDENCY_LOCK_DIGEST" \
              -e "VOODOO_G8_SBOM_DIGEST=$VOODOO_G8_SBOM_DIGEST" \
              -e "VOODOO_G8_REVOCATION_EPOCH=$VOODOO_G8_REVOCATION_EPOCH" \
              -e "VONE_G8_ACCEPTANCE_ADMIN_PASSWORD=$VONE_G8_ACCEPTANCE_ADMIN_PASSWORD" \
              -e "VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD=$VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD" \
              -e "VONE_G8_TARGET_REPOSITORY=$VONE_G8_TARGET_REPOSITORY" \
              -e "VONE_G8_TARGET_REF=$VONE_G8_TARGET_REF" \
              -e "VONE_G8_EXPECTED_TARGET_SHA=$VONE_G8_EXPECTED_TARGET_SHA" \
              "$VONE_G8_CONTAINER" "$@"
          }

          g8_exec sh -c \
            'nohup python -m uvicorn voodoo_product.main:app --host 0.0.0.0 --port 8000 --no-access-log --no-server-header >/tmp/g8-app.log 2>&1 </dev/null & echo $! >/tmp/g8-app.pid'
          for _ in $(seq 1 40); do
            if curl -fsS "$VONE_G8_BASE_URL/api/v1/health" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$VONE_G8_BASE_URL/api/v1/health" >/dev/null
          python scripts/g8_live_product_acceptance.py http-e2e \
            > "$RUNNER_TEMP/g8-evidence/http-e2e.json"
          python scripts/g8_live_product_acceptance.py http-create-approved \
            > "$RUNNER_TEMP/g8-evidence/restart-request.json"
          REQUEST_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["request_id"])' \
            "$RUNNER_TEMP/g8-evidence/restart-request.json")"

          docker exec "$VONE_G8_CONTAINER" sh -c \
            'kill "$(cat /tmp/g8-app.pid)"; for i in $(seq 1 20); do kill -0 "$(cat /tmp/g8-app.pid)" 2>/dev/null || exit 0; sleep 1; done; exit 1'

          g8_exec sh -c \
            'python /app/g8_live_product_acceptance.py prepare-active --request-id "$1" --hold-seconds 600 >/tmp/g8-active-prepare.json 2>/tmp/g8-active-prepare.err & echo $! >/tmp/g8-prepare.pid' \
            sh "$REQUEST_ID"
          for _ in $(seq 1 40); do
            if docker exec "$VONE_G8_CONTAINER" test -s /tmp/g8-active-prepare.json; then break; fi
            sleep 1
          done
          docker exec "$VONE_G8_CONTAINER" test -s /tmp/g8-active-prepare.json
          docker exec "$VONE_G8_CONTAINER" cat /tmp/g8-active-prepare.json \
            | tail -n1 > "$RUNNER_TEMP/g8-evidence/active-prepare.json"
          EXECUTION_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["execution_id"])' \
            "$RUNNER_TEMP/g8-evidence/active-prepare.json")"

          docker exec \
            -e VOODOO_ENV=staging \
            -e VOODOO_DATABASE_BACKEND=sqlite \
            -e VOODOO_PRODUCT_DB=/app/storage/product/voodoo_one.sqlite3 \
            -e VOODOO_PRODUCT_SANDBOX_ROOT=/app/storage/product/sandboxes \
            -e "VOODOO_SESSION_SIGNING_SECRET=$VOODOO_SESSION_SIGNING_SECRET" \
            -e "VOODOO_BOOTSTRAP_TOKEN=$VOODOO_BOOTSTRAP_TOKEN" \
            "$VONE_G8_CONTAINER" python /app/g8_live_product_acceptance.py \
            assert-lineage --execution-id "$EXECUTION_ID" --status ACTIVE \
            > "$RUNNER_TEMP/g8-evidence/lineage-active.json"

          docker exec "$VONE_G8_CONTAINER" sh -c \
            'kill -9 "$(cat /tmp/g8-prepare.pid)"; for i in $(seq 1 20); do kill -0 "$(cat /tmp/g8-prepare.pid)" 2>/dev/null || exit 0; sleep 1; done; exit 1'
          printf '{"status":"PASS","execution_id":"%s","interrupted_process":"prepare-active"}\n' \
            "$EXECUTION_ID" > "$RUNNER_TEMP/g8-evidence/active-interruption.json"

          g8_exec python /app/g8_live_product_acceptance.py \
            resume --execution-id "$EXECUTION_ID" \
            | tail -n1 > "$RUNNER_TEMP/g8-evidence/resume-result.json"

          docker exec \
            -e VOODOO_ENV=staging \
            -e VOODOO_DATABASE_BACKEND=sqlite \
            -e VOODOO_PRODUCT_DB=/app/storage/product/voodoo_one.sqlite3 \
            -e VOODOO_PRODUCT_SANDBOX_ROOT=/app/storage/product/sandboxes \
            -e "VOODOO_SESSION_SIGNING_SECRET=$VOODOO_SESSION_SIGNING_SECRET" \
            -e "VOODOO_BOOTSTRAP_TOKEN=$VOODOO_BOOTSTRAP_TOKEN" \
            "$VONE_G8_CONTAINER" python /app/g8_live_product_acceptance.py \
            assert-lineage --execution-id "$EXECUTION_ID" --status COMPLETED \
            > "$RUNNER_TEMP/g8-evidence/lineage-completed.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "g8-evidence"
          active = json.loads((root / "lineage-active.json").read_text())
          completed = json.loads((root / "lineage-completed.json").read_text())
          resume = json.loads((root / "resume-result.json").read_text())
          assert active["execution_id"] == completed["execution_id"] == resume["execution_id"]
          assert active["counts"] == completed["counts"]
          assert active["current_epoch"] == completed["current_epoch"]
          assert active["current_lease_id"] == completed["current_lease_id"]
          assert active["current_lease_digest"] == completed["current_lease_digest"]
          assert resume["status"] == "VERIFIED"
          assert resume["runner_commit_sha"] == resume["verifier_commit_sha"]
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "g8-evidence"
          summary = {
              "status": "VERIFIED",
              "source_sha": os.environ["GITHUB_SHA"],
              "authenticated_http_read": True,
              "active_process_interruption": True,
              "same_execution_resume": True,
              "duplicate_lineage_count": 0,
              "independent_verification_result": True,
              "provider_write_performed": False,
              "production_effects": False,
              "release_performed": False,
              "deployment_performed": False,
          }
          (root / "acceptance-summary.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          cat "$RUNNER_TEMP/g8-evidence/acceptance-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup isolated runtime and firewall
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${VONE_G8_CONTAINER_IP:-}" ] && [ -n "${VONE_G8_API_IP:-}" ]; then
            sudo iptables -D DOCKER-USER \
              -s "$VONE_G8_CONTAINER_IP" \
              -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
            sudo iptables -D DOCKER-USER \
              -s "$VONE_G8_CONTAINER_IP" \
              -d "$VONE_G8_API_IP" \
              -p tcp --dport 443 -j ACCEPT
            sudo iptables -D DOCKER-USER -s "$VONE_G8_CONTAINER_IP" -j DROP
          fi
          if [ -n "${VONE_G8_CONTAINER:-}" ]; then
            docker rm -f "$VONE_G8_CONTAINER"
          fi
          if [ -n "${VONE_G8_NETWORK:-}" ]; then
            docker network rm "$VONE_G8_NETWORK"
          fi

      - name: Sanitize and seal G8 acceptance evidence
        id: sanitize_evidence
        if: always()
        shell: bash
        env:
          RUNNER_GITHUB_TOKEN: ${{ secrets.VONE_G8_RUNNER_GITHUB_TOKEN }}
          VERIFIER_GITHUB_TOKEN: ${{ secrets.VONE_G8_VERIFIER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g8-evidence"
          test -d "$ROOT"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "g8-evidence"
          names = (
              "RUNNER_GITHUB_TOKEN",
              "VERIFIER_GITHUB_TOKEN",
              "VOODOO_SESSION_SIGNING_SECRET",
              "VOODOO_BOOTSTRAP_TOKEN",
              "VONE_G8_ACCEPTANCE_ADMIN_PASSWORD",
              "VONE_G8_ACCEPTANCE_OPERATOR_PASSWORD",
          )
          secrets = [os.environ.get(name, "") for name in names]
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if any(secret.encode() in raw for secret in secrets if secret):
                  raise SystemExit(f"secret material found in evidence file: {path.name}")
          PY
          rm -f "$ROOT/SHA256SUMS.txt"
          (cd "$ROOT" && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)

      - name: Upload sanitized G8 acceptance evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g8-live-product-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g8-evidence/
          if-no-files-found: error
          retention-days: 30
